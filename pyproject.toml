[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-server"
version = "1.0.0"
description = "MCP server for intelligent document processing - extract, classify, summarize PDFs/Docs/Images using vision LLMs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AI Business Crew", email = "ai-crew@example.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["mcp", "document-processing", "vision-llm"]
dependencies = ["mcp>=1.0.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/KennyWayn3/document-intelligence-server"
Repository = "https://github.com/KennyWayn3/document-intelligence-server"

[project.scripts]
document-intelligence-server = "document_intelligence_server.server:app.run"

[tool.setuptools.packages.find]
where = ["."]
include = ["document_intelligence_server*"]
